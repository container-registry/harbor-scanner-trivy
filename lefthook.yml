---
pre-commit:
  parallel: true
  commands:
    spellcheck:
      glob: "*.{md,txt,yml,yaml}"
      run: typos --config .typos.toml {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: |
        msg=$(head -1 {1})
        pattern="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|upstream)(\(.+\))?(!)?: .+"
        if ! echo "$msg" | grep -E "$pattern" >/dev/null; then
          echo "ERROR: Commit message must follow Conventional Commits format"
          echo "  Format: <type>[optional scope]: <description>"
          echo "  Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, upstream"
          echo "  Example: feat: add SBOM scan capability"
          echo "  Example: fix(queue): resolve retry backoff timing"
          echo "  Got: $msg"
          exit 1
        fi
    dco-signoff:
      run: |
        # Final paragraph only, and stripspace honours core.commentChar: a plain
        # grep accepts a bare trailer and one carried in a cherry-picked body.
        trailers=$(git stripspace --strip-comments < {1} | awk '/^[[:space:]]*$/ {blank=1; next} {if (blank) {block=""; blank=0} block = block $0 "\n"} END {printf "%s", block}')
        if ! printf '%s' "$trailers" | grep -E "^Signed-off-by: .+ <[^<>@[:space:]]+@[^<>[:space:]]+>[[:space:]]*$" >/dev/null; then
          echo "ERROR: Missing DCO sign-off with a name and an address. Use 'git commit -s'"
          exit 1
        fi
