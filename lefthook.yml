---
pre-commit:
  parallel: true
  commands:
    spellcheck:
      glob: "*.{md,txt,yml,yaml}"
      run: typos --config .typos.toml {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: |
        msg=$(head -1 {1})
        pattern="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|upstream)(\(.+\))?(!)?: .+"
        if ! echo "$msg" | grep -Eq "$pattern"; then
          echo "ERROR: Commit message must follow Conventional Commits format"
          echo "  Format: <type>[optional scope]: <description>"
          echo "  Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, upstream"
          echo "  Example: feat: add SBOM scan capability"
          echo "  Example: fix(queue): resolve retry backoff timing"
          echo "  Got: $msg"
          exit 1
        fi
    dco-signoff:
      run: |
        # Same last-paragraph extraction and regex as `task dco-check` and the
        # DCO workflow, so all three agree. A plain grep over the message
        # accepts a bare "Signed-off-by:" and accepts one carried inside a
        # cherry-picked body; both of the other gates reject those.
        # Comment lines are dropped first: git has not stripped them yet when
        # commit-msg runs, so they would look like the final paragraph.
        trailers=$(grep -v '^#' {1} | awk '/^[[:space:]]*$/ {blank=1; next} {if (blank) {block=""; blank=0} block = block $0 "\n"} END {printf "%s", block}')
        if ! printf '%s' "$trailers" | grep -qE "^Signed-off-by: .+ <[^<>@[:space:]]+@[^<>[:space:]]+>[[:space:]]*$"; then
          echo "ERROR: Missing DCO sign-off. Use 'git commit -s'"
          exit 1
        fi
