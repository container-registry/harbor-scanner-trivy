---
name: PR Preview Chart

on:
  pull_request:
    branches: [main]
    # Allowlist: only build a preview when an input that actually reaches the
    # packaged chart changes. versions.env, Taskfile.yml and taskfile/helm.yml
    # gate chart-ci.yml, but the chart contents do not depend on them.
    paths:
      - "deploy/chart/**"
      - ".github/workflows/pr-chart.yml"
      - ".github/scripts/chart-annotate-images.sh"

permissions:
  contents: read

concurrency:
  group: pr-chart-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-chart:
    name: Publish Preview Chart
    # Forked PRs cannot mint the GitHub OIDC token that Harbor's federated
    # robot login exchanges, and dependabot runs get no id-token either. A
    # chart release PR only restamps version, changelog and README, so its
    # preview would be main's chart under a different version.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Mint the OIDC token Harbor's federated robot login exchanges, and the
      # one cosign signs with
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
      PREVIEW_PROJECT: ${{ vars.PR_REGISTRY_PROJECT || '8gcr-dev' }}
      RELEASE_PROJECT: ${{ vars.REGISTRY_PROJECT || '8gcr' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The PR head, not the merge commit: the same ref the image preview
          # builds, so both artifacts come from one commit.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Load version pins
        run: |
          grep -E '^[A-Z_0-9]+=' versions.env >> "$GITHUB_ENV"
          {
            echo "HELM_CACHE_HOME=${RUNNER_TEMP}/helm/cache"
            echo "HELM_CONFIG_HOME=${RUNNER_TEMP}/helm/config"
            echo "HELM_DATA_HOME=${RUNNER_TEMP}/helm/data"
          } >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install Artifact Hub CLI
        # Checksum-verified before it runs: this job holds registry credentials
        # and id-token: write.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) goarch="amd64" ;;
            aarch64|arm64) goarch="arm64" ;;
            *) echo "::error::unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="ah_${AH_VERSION}_linux_${goarch}.tar.gz"
          base="https://github.com/artifacthub/hub/releases/download/v${AH_VERSION}"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "${base}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          curl -fsSL "${base}/ah_${AH_VERSION}_checksums.txt" -o "${RUNNER_TEMP}/ah_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep "  ${archive}$" ah_checksums.txt | sha256sum -c -)
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" ah
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Validate the registry destination
        # The next step mints an OIDC token with this host as its audience, so
        # the destination is allowlisted rather than trusted, even though it
        # comes from a repository variable and not a free-form input.
        env:
          ALLOWED: ${{ vars.REGISTRY_ALLOWLIST || '8gears.container-registry.com' }}
        run: |
          set -euo pipefail
          ok=false
          for host in ${ALLOWED//,/ }; do
            if [ "${REGISTRY_ADDRESS}" = "${host}" ]; then ok=true; break; fi
          done
          if [ "${ok}" != true ]; then
            echo "::error::REGISTRY_ADDRESS '${REGISTRY_ADDRESS}' is not in the allowlist (${ALLOWED})."
            exit 1
          fi
          echo "Publishing to ${REGISTRY_ADDRESS}/${PREVIEW_PROJECT}"

      - name: Resolve the preview version
        id: version
        # <chart version>-pr.<N>: a semver prerelease, so helm accepts it as an
        # exact --version and the OCI tag is the version string itself. It is
        # overwritten on every push, like the image preview tag; the comment
        # carries the digest for pinning.
        run: |
          set -euo pipefail
          read_key() {
            awk -F'[:[:space:]]+' -v key="$1" '$1 == key { gsub(/["'"'"']/, "", $2); print $2; exit }' deploy/chart/Chart.yaml
          }
          version="$(read_key version)"
          app_version="$(read_key appVersion)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unusable chart version in deploy/chart/Chart.yaml: '${version}'"
            exit 1
          fi
          if [[ ! "${app_version}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Unusable appVersion in deploy/chart/Chart.yaml: '${app_version}'"
            exit 1
          fi
          preview="${version}-pr.${PR_NUMBER}"
          echo "PREVIEW_VERSION=${preview}" >> "$GITHUB_ENV"
          {
            echo "version=${preview}"
            echo "app_version=${app_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Add the per-release Artifact Hub images annotation
        # The annotation names the image the chart defaults to: the released
        # appVersion in the release project, not the preview project.
        run: .github/scripts/chart-annotate-images.sh deploy/chart "${REGISTRY_ADDRESS}" "${RELEASE_PROJECT}"

      - name: Validate Artifact Hub metadata
        run: ah lint --kind helm --path deploy/chart

      - name: Package chart
        # appVersion is left as committed, so the default image tag resolves to
        # an adapter release that has already been published.
        run: helm package deploy/chart --version "${PREVIEW_VERSION}" --destination dist

      - name: Mint OIDC token for Harbor
        id: harbor-oidc
        env:
          AUDIENCE: https://${{ env.REGISTRY_ADDRESS }}
        run: |
          response=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")
          token=$(jq -r '.value' <<<"${response}")
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      # cosign reads ~/.docker/config.json; helm keeps its own registry config,
      # so both logins are needed.
      - name: Log in to registry (docker config, for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY_ADDRESS }}
          # Keyless: the username is ignored, the OIDC JWT is the password
          username: jwt
          password: ${{ steps.harbor-oidc.outputs.token }}

      - name: Log in to registry (helm)
        env:
          TOKEN: ${{ steps.harbor-oidc.outputs.token }}
        run: helm registry login "${REGISTRY_ADDRESS}" --username jwt --password-stdin <<< "${TOKEN}"

      - name: Push chart
        id: push
        # pipefail: GitHub's default shell is `bash -e` without it, so a failing
        # helm push would be masked by tee - and its error text can itself
        # contain a sha256 digest the capture below would happily match.
        run: |
          set -euo pipefail
          helm push "dist/harbor-scanner-trivy-${PREVIEW_VERSION}.tgz" \
            "oci://${REGISTRY_ADDRESS}/${PREVIEW_PROJECT}/charts" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[a-f0-9]\{64\}' push.log | head -1)
          if [ -z "${digest}" ]; then
            echo "::error::Failed to capture the chart digest from helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart
        env:
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${REGISTRY_ADDRESS}/${PREVIEW_PROJECT}/charts/harbor-scanner-trivy@${CHART_DIGEST}"

  pr-comment:
    name: Comment Preview Chart Ref
    needs: [preview-chart]
    runs-on: ubuntu-latest
    permissions:
      # Create or update the sticky preview comment
      pull-requests: write
    env:
      REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
      PREVIEW_PROJECT: ${{ vars.PR_REGISTRY_PROJECT || '8gcr-dev' }}
      PREVIEW_VERSION: ${{ needs.preview-chart.outputs.version }}
      APP_VERSION: ${{ needs.preview-chart.outputs.app_version }}
      DIGEST: ${{ needs.preview-chart.outputs.digest }}
    steps:
      - name: Create or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          MARKER: "<!-- harbor-scanner-trivy-pr-chart-preview -->"
        with:
          script: |
            const marker = process.env.MARKER;
            const registry = process.env.REGISTRY_ADDRESS;
            const previewProject = process.env.PREVIEW_PROJECT;
            const chart = `${registry}/${previewProject}/charts/harbor-scanner-trivy`;
            const previewVersion = process.env.PREVIEW_VERSION;
            const appVersion = process.env.APP_VERSION;
            const digest = process.env.DIGEST;
            const repository = process.env.GITHUB_REPOSITORY;
            const issueNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const body = `${marker}
            A preview chart for this PR is available:

            \`\`\`
            helm install harbor-scanner-trivy \\
              oci://${chart} \\
              --version ${previewVersion}
            \`\`\`

            Digest: \`${digest}\`

            The chart defaults to adapter \`${appVersion}\`. To run it against this PR's preview image instead (published only when the PR also changes image inputs):

            \`\`\`
            helm install harbor-scanner-trivy \\
              oci://${chart} \\
              --version ${previewVersion} \\
              --set image.registry=${registry} \\
              --set image.repository=${previewProject}/harbor-scanner-trivy \\
              --set image.tag=pr-${issueNumber}
            \`\`\`

            Verify the preview chart:

            \`\`\`
            cosign verify \\
              --certificate-identity-regexp="https://github.com/${repository}/.github/workflows/pr-chart.yml@.*" \\
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
              ${chart}@${digest}
            \`\`\``;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existingComment = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });
