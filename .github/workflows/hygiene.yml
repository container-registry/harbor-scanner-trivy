---
name: Hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          inputs: .
          online-audits: true
          persona: regular

  pinned-actions:
    name: Check Pinned Action SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check all actions are pinned to full SHA with version comment
        run: |
          failed=0
          while IFS= read -r file; do
            # `|| [ -n "$line" ]` still processes a final line without a trailing newline
            while IFS= read -r line || [ -n "$line" ]; do
              if echo "$line" | grep -qE '^\s*(-\s+)?uses:\s+'; then
                ref=$(echo "$line" | sed 's/.*uses:[[:space:]]*//' | awk '{print $1}')
                # `$/` resolves to this repository at the running commit, so it
                # is pinned by construction. `./` is deliberately not skipped:
                # it loads whatever the workspace holds and zizmor flags it.
                if echo "$ref" | grep -qE '^(\$/|docker://)'; then
                  continue
                fi
                if ! echo "$line" | grep -qE '@[a-f0-9]{40}[[:space:]]+#[[:space:]]*v[0-9]'; then
                  echo "UNPINNED OR MISSING '# vX.Y.Z' COMMENT: $file -> $ref"
                  failed=1
                fi
              fi
            done < "$file"
          done < <(find .github/workflows .github/actions -name '*.yml' -o -name '*.yaml')
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "All 'uses:' references must be pinned to a full 40-char commit SHA"
            echo "followed by a version comment."
            echo "Example: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0"
            echo "In-repo actions and workflows use the self-repository form: uses: \$/.github/..."
            exit 1
          fi
          echo "All actions are pinned."

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    # Requires Dependency Graph to be enabled in repo settings; this is a
    # real gate (fail-on-severity), so it must not be continue-on-error.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
