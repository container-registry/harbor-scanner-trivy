---
name: PR Title

# DO NOT ADD actions/checkout TO THIS WORKFLOW.
#
# pull_request_target, not pull_request: with pull_request, a pull request that
# edits this file runs its own edited copy, so the check it is supposed to pass
# can be replaced with one that always succeeds. pull_request_target runs the
# definition from the base branch instead. Neither job needs the head code:
# the title comes from the event payload and the changed file list comes from
# the API, so the usual danger of this trigger does not apply as long as
# nothing checks out the head.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, edited, synchronize]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      scope: ${{ steps.lint.outputs.scope }}
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        id: lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            upstream
          requireScope: false
          subjectPattern: ^.{1,100}$
          subjectPatternError: |
            Subject must be 100 characters or less.

  chart-scope-paths:
    name: Chart Scope Paths
    # release-please has no scope filter and drops a commit from the adapter
    # line only when every file it touches is under exclude-paths. A
    # (chart)-scoped PR that edits one root file therefore lands in the adapter
    # changelog and bumps the adapter version. The negated patterns mirror
    # exclude-paths in .release-please/config-adapter.json; keep them in sync.
    # Gated on the scope the lint job parsed, not a title substring, so subject
    # text mentioning "(chart):" cannot trigger it. dorny/paths-filter lists
    # the changed files through the API when there is no checkout, which is
    # what keeps this job safe under pull_request_target.
    needs: lint
    if: needs.lint.outputs.scope == 'chart'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          list-files: shell
          filters: |
            adapter:
              - '**'
              - '!.github/**'
              - '!docs/**'
              - '!deploy/**'
              - '!taskfile/**'
              - '!.release-please/**'

      - name: Fail on adapter-release paths
        if: steps.filter.outputs.adapter == 'true'
        env:
          FILES: ${{ steps.filter.outputs.adapter_files }}
        run: |
          echo "::error::A (chart)-scoped PR may only touch paths the adapter release line excludes. Offending: ${FILES}"
          exit 1
