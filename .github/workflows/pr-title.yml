---
name: PR Title

# DO NOT ADD actions/checkout TO THIS WORKFLOW. pull_request_target is only
# safe here because neither job touches the head code; under pull_request a
# pull request editing this file would run its own copy of the check.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, edited, synchronize]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      scope: ${{ steps.lint.outputs.scope }}
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6  # v6.1.2
        id: lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            upstream
          requireScope: false
          subjectPattern: ^.{1,100}$
          subjectPatternError: |
            Subject must be 100 characters or less.

  release-notes:
    name: Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Fetched at the base commit, never checked out: a pull request must not
      # change the rule it is judged by.
      - name: Check the release notes section
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/release-notes.mjs?ref=${BASE_SHA}" \
            -H 'Accept: application/vnd.github.raw' > "${RUNNER_TEMP}/release-notes.mjs"
          node "${RUNNER_TEMP}/release-notes.mjs" check

  chart-scope-paths:
    name: Chart Scope Paths
    # release-please has no scope filter and drops a commit from the adapter
    # line only when every file it touches is under exclude-paths. A
    # (chart)-scoped PR that edits one root file therefore lands in the adapter
    # changelog and bumps the adapter version. The negated patterns mirror
    # exclude-paths in .release-please/config-adapter.json; keep them in sync.
    # Gated on the scope the lint job parsed, not a title substring, so subject
    # text mentioning "(chart):" cannot trigger it.
    needs: lint
    if: needs.lint.outputs.scope == 'chart'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          list-files: shell
          filters: |
            adapter:
              - '**'
              - '!.github/**'
              - '!docs/**'
              - '!deploy/**'
              - '!taskfile/**'
              - '!.release-please/**'

      - name: Fail on adapter-release paths
        if: steps.filter.outputs.adapter == 'true'
        env:
          FILES: ${{ steps.filter.outputs.adapter_files }}
        run: |
          echo "::error::A (chart)-scoped PR may only touch paths the adapter release line excludes. Offending: ${FILES}"
          exit 1
