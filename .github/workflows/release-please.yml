---
name: Release Please

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: Publish Release Image
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-image.yml
    with:
      checkout_ref: ${{ needs.release-please.outputs.tag_name }}
      image_tag: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
      registry_address: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
      registry_project: ${{ vars.REGISTRY_PROJECT || '8gcr' }}

  release-please-chart:
    name: Release Please (chart)
    # The Helm chart has its own release line, scoped to helm/ by its own config
    # and manifest, so a chart fix does not force an adapter release (and an
    # adapter release does not republish an unchanged chart). Kept as a SEPARATE
    # release-please instance rather than a second package in the adapter
    # manifest: adding a package switches every output to the "<path>--<name>"
    # form, which would break the adapter jobs that read the unprefixed outputs.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['deploy/chart--release_created'] }}
      tag_name: ${{ steps.release.outputs['deploy/chart--tag_name'] }}
      version: ${{ steps.release.outputs['deploy/chart--version'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config-chart.json
          manifest-file: .release-please-manifest-chart.json

  publish-helm-chart:
    name: Publish Helm Chart
    # Driven by the chart's own release line, not the adapter's. The chart
    # references the adapter image by its appVersion, which a prior adapter
    # release must already have published, so this does not wait on the image
    # build.
    needs: [release-please-chart]
    if: ${{ needs.release-please-chart.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-chart.yml
    with:
      tag_name: ${{ needs.release-please-chart.outputs.tag_name }}
      registry_address: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
      registry_project: ${{ vars.REGISTRY_PROJECT || '8gcr' }}

  publish-binaries:
    name: Publish Release Binaries
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # Upload release assets
      contents: write
    outputs:
      trivy_version: ${{ steps.trivy-version.outputs.trivy_version }}
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      # Bare semver, matching what publish-image stamps into the image binary
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Read Trivy pin
        id: trivy-version
        run: echo "trivy_version=$(grep '^TRIVY_BASE_IMAGE_VERSION=' versions.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build adapter and Trivy binaries
        run: |
          task build PLATFORMS=linux/amd64,linux/arm64 VERSION="${VERSION}"
          task build:trivy PLATFORMS=linux/amd64,linux/arm64

      - name: Package and upload release assets
        run: |
          task dist:binaries PLATFORMS=linux/amd64,linux/arm64
          # --clobber keeps re-runs idempotent when assets already exist
          gh release upload "${TAG_NAME}" dist/*.tar.gz dist/checksums.txt --clobber

  update-release-notes:
    name: Update Release Notes
    needs: [release-please, publish-image, publish-binaries]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
      REGISTRY_PROJECT: ${{ vars.REGISTRY_PROJECT || '8gcr' }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
      TRIVY_VERSION: ${{ needs.publish-binaries.outputs.trivy_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Append artifact details to release notes
        run: |
          REGISTRY="${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}"

          # Idempotency: a re-run must not stack another artifact section
          if gh release view "${TAG_NAME}" --json body -q .body | grep -q "^## Container Image$"; then
            echo "Release notes already contain the artifact section; skipping."
            exit 0
          fi

          {
            gh release view "${TAG_NAME}" --json body -q .body
            echo ""
            echo "---"
            echo ""
            echo "## Container Image"
            echo ""
            echo "Multi-arch image (\`linux/amd64\`, \`linux/arm64\`) signed with [cosign](https://github.com/sigstore/cosign)."
            echo ""
            echo "| Image | Reference |"
            echo "|-------|-----------|"
            echo "| \`harbor-scanner-trivy\` | \`${REGISTRY}/harbor-scanner-trivy:${TAG_NAME}\` |"
            echo ""
            echo "**Verify the image signature:**"
            echo "\`\`\`sh"
            echo "cosign verify \\"
            echo "  --certificate-identity \"https://github.com/${GH_REPO}/.github/workflows/publish-image.yml@refs/heads/main\" \\"
            echo "  --certificate-oidc-issuer \"https://token.actions.githubusercontent.com\" \\"
            echo "  ${REGISTRY}/harbor-scanner-trivy:${TAG_NAME}"
            echo "\`\`\`"
            echo ""
            echo "**Verify the SBOM attestation:**"
            echo "\`\`\`sh"
            echo "cosign verify-attestation \\"
            echo "  --certificate-identity \"https://github.com/${GH_REPO}/.github/workflows/publish-image.yml@refs/heads/main\" \\"
            echo "  --certificate-oidc-issuer \"https://token.actions.githubusercontent.com\" \\"
            echo "  --type spdxjson \\"
            echo "  ${REGISTRY}/harbor-scanner-trivy@${IMAGE_DIGEST}"
            echo "\`\`\`"
            echo ""
            echo "## Helm Chart"
            echo ""
            # The chart has its own release line (chart-v* tags), so no chart
            # version is pinned here: it would go stale the moment either line
            # moves without the other.
            echo "The chart is released separately - see the [\`chart-v*\` releases](https://github.com/${GH_REPO}/releases?q=chart-v)."
            echo "To deploy this adapter version with the latest chart:"
            echo ""
            echo "\`\`\`sh"
            echo "helm install harbor-scanner-trivy \\"
            echo "  oci://${REGISTRY}/charts/harbor-scanner-trivy \\"
            echo "  --set image.tag=${TAG_NAME}"
            echo "\`\`\`"
            echo ""
            echo "## Binaries"
            echo ""
            echo "Static \`linux/amd64\` and \`linux/arm64\` binaries are attached to this release"
            echo "(\`checksums.txt\` has the SHA256 sums):"
            echo ""
            echo "| Asset | Contents |"
            echo "|-------|----------|"
            echo "| \`scanner-trivy_linux-<arch>.tar.gz\` | Harbor scanner adapter ${TAG_NAME} |"
            echo "| \`trivy_linux-<arch>.tar.gz\` | Trivy CLI v${TRIVY_VERSION}, built from source |"
          } | gh release edit "${TAG_NAME}" --notes-file -
