---
name: Publish Chart

run-name: Publish Helm Chart ${{ inputs.tag_name }}

on:
  workflow_call:
    inputs:
      tag_name:
        description: Existing chart release tag to publish, e.g. chart-v1.0.0
        required: true
        type: string
      registry_address:
        required: false
        type: string
        default: 8gears.container-registry.com
      registry_project:
        required: false
        type: string
        default: 8gcr
    # No secrets: registry auth is keyless via Harbor's Federated Identity
    # Provider, the same way publish-image.yml authenticates.
    outputs:
      digest:
        description: Digest of the pushed chart
        value: ${{ jobs.publish.outputs.digest }}
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing chart release tag, e.g. chart-v1.0.0
        required: true
        type: string
      registry_address:
        description: OCI registry to push the chart to
        required: false
        type: string
        default: 8gears.container-registry.com
      registry_project:
        description: Project within the registry
        required: false
        type: string
        default: 8gcr

permissions:
  contents: read

concurrency:
  group: publish-chart-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Append the artifact section to the chart release notes
      contents: write
      # Mint the OIDC token Harbor's federated robot login exchanges, and the
      # one cosign signs with
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      REGISTRY_ADDRESS: ${{ inputs.registry_address }}
      REGISTRY_PROJECT: ${{ inputs.registry_project }}
      TAG_NAME: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve and validate the release tag
        id: release
        # The tag is the only input that decides what gets published, so it is
        # resolved to a SHA here and everything downstream uses that SHA: a tag
        # moved after the release was created cannot change what is built.
        run: |
          set -euo pipefail
          if [[ ! "${TAG_NAME}" =~ ^chart-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::TAG_NAME must match chart-vX.Y.Z, got '${TAG_NAME}'"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          tag_sha=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')
          read -r draft target < <(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq '"\(.draft) \(.target_commitish)"')
          if [ "${draft}" != "false" ] || [ "${target}" != "${tag_sha}" ]; then
            echo "::error::${TAG_NAME} must be a published release pinned to ${tag_sha} (draft=${draft}, target=${target})"
            exit 1
          fi

          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "sha=${tag_sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Load version pins
        run: |
          grep -E '^[A-Z_0-9]+=' versions.env >> "$GITHUB_ENV"
          {
            echo "HELM_CACHE_HOME=${RUNNER_TEMP}/helm/cache"
            echo "HELM_CONFIG_HOME=${RUNNER_TEMP}/helm/config"
            echo "HELM_DATA_HOME=${RUNNER_TEMP}/helm/data"
          } >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Install Artifact Hub CLI
        # Checksum-verified before it runs: this job holds registry credentials
        # and id-token: write.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) goarch="amd64" ;;
            aarch64|arm64) goarch="arm64" ;;
            *) echo "::error::unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          archive="ah_${AH_VERSION}_linux_${goarch}.tar.gz"
          base="https://github.com/artifacthub/hub/releases/download/v${AH_VERSION}"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "${base}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          curl -fsSL "${base}/ah_${AH_VERSION}_checksums.txt" -o "${RUNNER_TEMP}/ah_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep "  ${archive}$" ah_checksums.txt | sha256sum -c -)
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" ah
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Validate the registry destination
        # workflow_dispatch exposes registry_address as a free-form input, and
        # the next step mints an OIDC token with that host as its audience. An
        # arbitrary value would hand a signed token to a registry we do not
        # control, so the destination is allowlisted rather than trusted.
        env:
          ALLOWED: ${{ vars.REGISTRY_ALLOWLIST || '8gears.container-registry.com' }}
        run: |
          set -euo pipefail
          ok=false
          for host in ${ALLOWED//,/ }; do
            if [ "${REGISTRY_ADDRESS}" = "${host}" ]; then ok=true; break; fi
          done
          if [ "${ok}" != true ]; then
            echo "::error::registry_address '${REGISTRY_ADDRESS}' is not in the allowlist (${ALLOWED})."
            exit 1
          fi
          echo "Publishing to ${REGISTRY_ADDRESS}"

      - name: Mint OIDC token for Harbor
        id: harbor-oidc
        env:
          AUDIENCE: https://${{ inputs.registry_address }}
        run: |
          response=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")
          token=$(jq -r '.value' <<<"${response}")
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      # cosign and oras read ~/.docker/config.json; helm keeps its own registry
      # config, so both logins are needed.
      - name: Log in to registry (docker config, for cosign and oras)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.registry_address }}
          # Keyless: the username is ignored, the OIDC JWT is the password
          username: jwt
          password: ${{ steps.harbor-oidc.outputs.token }}

      - name: Log in to registry (helm)
        env:
          TOKEN: ${{ steps.harbor-oidc.outputs.token }}
        run: helm registry login "${REGISTRY_ADDRESS}" --username jwt --password-stdin <<< "${TOKEN}"

      - name: Add the per-release Artifact Hub images annotation
        # Shared with the chart-ci dry run, so this path is exercised on every
        # chart PR rather than first on release day.
        run: .github/scripts/chart-annotate-images.sh deploy/chart "${REGISTRY_ADDRESS}" "${REGISTRY_PROJECT}"

      - name: Validate Artifact Hub metadata
        run: ah lint --kind helm --path deploy/chart

      - name: Package chart
        # VERSION comes from the validated release tag. appVersion is left as
        # committed, so the default image tag resolves to an adapter release
        # that has already been published.
        run: helm package deploy/chart --version "${VERSION}" --destination dist

      - name: Push chart
        id: push
        # pipefail: GitHub's default shell is `bash -e` without it, so a failing
        # helm push would be masked by tee - and its error text can itself
        # contain a sha256 digest the capture below would happily match.
        run: |
          set -euo pipefail
          helm push "dist/harbor-scanner-trivy-${VERSION}.tgz" \
            "oci://${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/charts" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[a-f0-9]\{64\}' push.log | head -1)
          if [ -z "${digest}" ]; then
            echo "::error::Failed to capture the chart digest from helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign chart
        env:
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/charts/harbor-scanner-trivy@${CHART_DIGEST}"

      - name: Push Artifact Hub repository metadata
        # artifacthub-repo.yml rides next to the chart as its own OCI artifact
        # under the artifacthub.io tag; Artifact Hub reads it for ownership and
        # the verified-publisher badge. It is .helmignore'd out of the package.
        working-directory: deploy/chart
        run: |
          oras push "${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}/charts/harbor-scanner-trivy:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Append artifact details to the chart release notes
        env:
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          REGISTRY="${REGISTRY_ADDRESS}/${REGISTRY_PROJECT}"

          # Idempotency: a re-run must not stack another artifact section
          if gh release view "${TAG_NAME}" --json body -q .body | grep -q "^## Install$"; then
            echo "Release notes already contain the artifact section; skipping."
            exit 0
          fi

          {
            gh release view "${TAG_NAME}" --json body -q .body
            echo ""
            echo "---"
            echo ""
            echo "## Install"
            echo ""
            echo "\`\`\`sh"
            echo "helm install harbor-scanner-trivy \\"
            echo "  oci://${REGISTRY}/charts/harbor-scanner-trivy \\"
            echo "  --version ${VERSION} --namespace harbor --create-namespace"
            echo "\`\`\`"
            echo ""
            echo "Chart \`${VERSION}\` defaults to adapter \`$(grep -E '^appVersion:' deploy/chart/Chart.yaml | awk '{print $2}' | tr -d '\"')\`."
            echo ""
            echo "**Verify the chart signature:**"
            echo ""
            echo "\`\`\`sh"
            echo "cosign verify \\"
            echo "  --certificate-identity \"https://github.com/${GH_REPO}/.github/workflows/publish-chart.yml@refs/heads/main\" \\"
            echo "  --certificate-oidc-issuer \"https://token.actions.githubusercontent.com\" \\"
            echo "  ${REGISTRY}/charts/harbor-scanner-trivy@${CHART_DIGEST}"
            echo "\`\`\`"
          } | gh release edit "${TAG_NAME}" --notes-file -
