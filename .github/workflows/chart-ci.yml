---
name: Chart CI

on:
  pull_request:
    paths:
      - "deploy/chart/**"
      - "Taskfile.yml"
      - "taskfile/helm.yml"
      - "taskfile/ct-lintconf.yaml"
      - "versions.env"
      - ".github/workflows/chart-ci.yml"
      - ".github/actions/setup/**"
      - ".github/scripts/chart-annotate-images.sh"
  push:
    branches: [main]
    paths:
      - "deploy/chart/**"
      - ".github/actions/setup/**"
      - "Taskfile.yml"
      - "taskfile/helm.yml"
      - "taskfile/ct-lintconf.yaml"
      - "versions.env"
      - ".github/workflows/chart-ci.yml"
      - ".github/scripts/chart-annotate-images.sh"

permissions: {}

concurrency:
  group: chart-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chart-quality:
    name: Chart Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The chart's Trivy SARIF goes to the Security tab. On a private
      # repository that upload also needs actions: read.
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load version pins
        # Helm homes: keep all helm state in the always-writable runner temp
        # rather than a possibly root-owned ~/.cache.
        run: |
          grep -E '^[A-Z_0-9]+=' versions.env >> "$GITHUB_ENV"
          {
            echo "HELM_CACHE_HOME=${RUNNER_TEMP}/helm/cache"
            echo "HELM_CONFIG_HOME=${RUNNER_TEMP}/helm/config"
            echo "HELM_DATA_HOME=${RUNNER_TEMP}/helm/data"
          } >> "$GITHUB_ENV"

      - name: Install Task
        uses: ./.github/actions/setup
        with:
          go: "false"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm-unittest
        # --verify=false: Helm 4 verifies plugin provenance by default, and
        # git-sourced plugins ship none.
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "${HELM_UNITTEST_VERSION}" --verify=false

      - name: Install Node
        # For ajv-cli via npx (strict schema compile); the taskfile falls back
        # to Docker only when npx is absent.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_IMAGE_VERSION }}

      - name: Install chart tools
        # Binaries rather than `docker run -v`: a bind mount resolves on the
        # Docker host, which is not the runner workspace when the daemon is
        # remote. helm-docs, chart-testing and kube-linter are verified against
        # the sha256 committed in versions.env; ah and trivy against the
        # checksums file published alongside their own release.
        run: |
          set -euo pipefail
          # The committed pins are of the linux/amd64 assets, and this job is
          # fixed to ubuntu-latest. Fail rather than install unverified
          # binaries if that ever stops being true.
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::the committed checksums are for x86_64 and this runner is $(uname -m)"
            exit 1
          fi
          bin="${RUNNER_TEMP}/bin"
          dl="${RUNNER_TEMP}/dl"
          mkdir -p "${bin}" "${dl}"
          cd "${dl}"

          fetch() {
            # $1 name, $2 url, $3 sha256, $4 archive member to extract
            curl -fsSL "$2" -o "$1.tar.gz"
            echo "$3  $1.tar.gz" | sha256sum -c -
            tar -xzf "$1.tar.gz" -C "${bin}" "$4"
          }

          # helm-docs
          fetch helm-docs \
            "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            "${HELM_DOCS_SHA256_LINUX_AMD64}" helm-docs

          # kube-linter (upstream's amd64 asset carries no arch suffix)
          fetch kube-linter \
            "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz" \
            "${KUBE_LINTER_SHA256_LINUX_AMD64}" kube-linter

          # chart-testing, plus the python deps its lint step shells out to
          ct_dir="${RUNNER_TEMP}/ct"
          mkdir -p "${ct_dir}"
          curl -fsSL "https://github.com/helm/chart-testing/releases/download/v${CT_VERSION}/chart-testing_${CT_VERSION}_linux_amd64.tar.gz" -o ct.tar.gz
          echo "${CT_SHA256_LINUX_AMD64}  ct.tar.gz" | sha256sum -c -
          tar -xzf ct.tar.gz -C "${ct_dir}"
          mv "${ct_dir}/ct" "${bin}/ct"
          {
            # Repo-owned yamllint config (release-please's Chart.yaml stamping
            # style fails ct's shipped strict conf); lint:ct also passes it
            # explicitly via --lint-conf.
            echo "CT_LINT_CONF=${GITHUB_WORKSPACE}/taskfile/ct-lintconf.yaml"
            echo "CT_CHART_YAML_SCHEMA=${ct_dir}/etc/chart_schema.yaml"
            # The drift guard reads the release just extracted rather than
            # downloading the tarball a second time.
            echo "CT_UPSTREAM_LINT_CONF=${ct_dir}/etc/lintconf.yaml"
          } >> "$GITHUB_ENV"
          # PIP_BREAK_SYSTEM_PACKAGES: Debian's PEP 668 guard refuses --user
          # installs; honored by new pip, ignored by old, and the runner is
          # ephemeral either way.
          export PIP_BREAK_SYSTEM_PACKAGES=1
          python3 -m pip install --user --quiet \
            "yamale==${YAMALE_VERSION}" "yamllint==${YAMLLINT_VERSION}" "pyyaml==${PYYAML_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Artifact Hub CLI (checksum-verified against the release's own file)
          ah_archive="ah_${AH_VERSION}_linux_amd64.tar.gz"
          ah_base="https://github.com/artifacthub/hub/releases/download/v${AH_VERSION}"
          curl -fsSL "${ah_base}/${ah_archive}" -o "${dl}/${ah_archive}"
          curl -fsSL "${ah_base}/ah_${AH_VERSION}_checksums.txt" -o "${dl}/ah_checksums.txt"
          grep "  ${ah_archive}$" ah_checksums.txt | sha256sum -c -
          tar -xzf "${dl}/${ah_archive}" -C "${bin}" ah

          # trivy (checksum-verified against the release's own file)
          trivy_archive="trivy_${TRIVY_BASE_IMAGE_VERSION}_Linux-64bit.tar.gz"
          trivy_base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_BASE_IMAGE_VERSION}"
          curl -fsSL "${trivy_base}/${trivy_archive}" -o "${dl}/${trivy_archive}"
          curl -fsSL "${trivy_base}/trivy_${TRIVY_BASE_IMAGE_VERSION}_checksums.txt" -o "${dl}/trivy_checksums.txt"
          grep "  ${trivy_archive}$" trivy_checksums.txt | sha256sum -c -
          tar -xzf "${dl}/${trivy_archive}" -C "${bin}" trivy

          echo "${bin}" >> "$GITHUB_PATH"

      # A CT_VERSION bump that rewrites any other rule of chart-testing's
      # lintconf must be noticed rather than silently dropped by the fork.
      - name: Chart-testing lint config drift
        run: task helm:lint:ct-drift

      # helm lint + ct lint + kube-linter + Artifact Hub metadata + schema
      - name: Lint
        run: task helm:lint

      - name: Render default values
        run: task helm:template

      - name: Unit tests
        run: task helm:unittest

      - name: Chart tooling golden tests
        run: task helm:tools:test

      - name: Values doctor
        run: task helm:values-doctor

      # Two client-side renders must match exactly - this is what Argo CD does
      # on every sync, and any diff is perpetual drift.
      - name: GitOps determinism
        run: task helm:gitops-determinism

      - name: Render examples
        run: task helm:examples

      - name: Chart README in sync with values.yaml
        run: task helm:docs:check

      - name: Trivy misconfiguration scan
        run: task helm:trivy

      # Findings below the HIGH/CRITICAL gate still reach the Security tab.
      - name: Trivy SARIF report
        if: always()
        run: task helm:trivy:report

      # Forks and Dependabot never get security-events: write, so uploading
      # would fail the gate for contributors who cannot fix it. The report is
      # still produced above, and the HIGH/CRITICAL gate still runs. Pushes to
      # main upload too - that is what feeds default-branch code scanning.
      - name: Upload Trivy SARIF
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: trivy-chart.sarif
          category: helm-chart

      # Everything the release job does before it talks to the registry, so the
      # release-only packaging path is exercised on every chart PR rather than
      # first on release day.
      - name: Release packaging dry run
        env:
          REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS || '8gears.container-registry.com' }}
          REGISTRY_PROJECT: ${{ vars.REGISTRY_PROJECT || '8gcr' }}
        run: task helm:release:dry-run
