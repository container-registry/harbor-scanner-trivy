---
name: Renovate

on:
  schedule:
    # Weekly, Monday 01:00 UTC. renovate.json sets no schedule of its own.
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only to read versions.env. Renovate acts through the app token minted
    # below, never through GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Step output, not GITHUB_ENV: anything exported as RENOVATE_* is read
      # by Renovate as a config override.
      - name: Read Renovate version
        id: versions
        run: |
          version="$(grep -E '^RENOVATE_VERSION=' versions.env | cut -d= -f2)"
          test -n "${version}" || { echo "::error::RENOVATE_VERSION missing from versions.env"; exit 1; }
          echo "renovate=${version}" >> "$GITHUB_OUTPUT"

      # Same Renovate GitHub App as container-registry/8gcr. It has to be
      # installed on this repository, with RENOVATE_APP_CLIENT_ID (variable)
      # and RENOVATE_APP_PRIVATE_KEY (secret) set here.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: container-registry
          repositories: harbor-scanner-trivy
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write  # dependencyDashboard
          permission-statuses: write
          permission-checks: read
          permission-administration: read  # GET /branches/{b}/protection

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084  # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ steps.versions.outputs.renovate }}
        env:
          RENOVATE_REPOSITORIES: container-registry/harbor-scanner-trivy
          LOG_LEVEL: info
