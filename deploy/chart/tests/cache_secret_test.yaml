---
suite: analysis cache Secret contents
release:
  name: scanner
templates:
  - secret-env.yaml
tests:
  - it: writes the configured cache URL to the chart-managed Secret
    set:
      secret.SCANNER_TRIVY_CACHE_BACKEND: redis://:fixture@cache:6379/0
    asserts:
      - equal:
          path: metadata.name
          value: scanner-harbor-scanner-trivy-env
      - equal:
          path: data.SCANNER_TRIVY_CACHE_BACKEND
          decodeBase64: true
          value: redis://:fixture@cache:6379/0
