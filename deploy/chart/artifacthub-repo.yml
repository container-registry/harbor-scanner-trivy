---
# Artifact Hub repository metadata
# (https://artifacthub.io/docs/topics/repositories/ - Helm OCI section).
#
# NOT part of the chart package (see .helmignore). The release pipeline pushes
# it as a separate OCI artifact alongside the chart:
#
#   oras push <registry>/8gcr/charts/harbor-scanner-trivy:artifacthub.io \
#     --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
#     artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
#
# After adding the repository on artifacthub.io (kind: Helm, URL:
# oci://8gears.container-registry.com/8gcr/charts/harbor-scanner-trivy) under
# the container-registry organization, set repositoryID to the ID Artifact Hub
# assigns, which is what enables the ownership metadata and the verified
# publisher badge.
#
# repositoryID: <uuid assigned by artifacthub.io>
owners:
  - name: 8gears
    email: vadim@8gears.com
