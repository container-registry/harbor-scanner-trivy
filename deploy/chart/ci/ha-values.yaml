---
# Multi-replica install with every optional workload object turned on.
replicaCount: 3
podManagementPolicy: Parallel

jobQueue:
  workerConcurrency: 1

# One worker per pod with its own local databases; share layer analysis through
# a dedicated Redis/Valkey instance. Configure that instance's memory budget and
# eviction policy independently of Harbor's operational Redis/Valkey.
trivy:
  cacheBackend: redis://harbor-scan-cache:6379/0
  cacheTTL: 168h

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

networkPolicy:
  enabled: true
  ingress:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: harbor

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: harbor-scanner-trivy
