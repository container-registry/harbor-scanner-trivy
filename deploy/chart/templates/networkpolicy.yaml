{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "harbor-scanner-trivy.fullname" . }}
  namespace: {{ include "harbor-scanner-trivy.namespace" . }}
  labels:
    {{- include "harbor-scanner-trivy.labels" . | nindent 4 }}
  {{- with (include "harbor-scanner-trivy.annotations" (dict "root" . "local" dict)) }}
  annotations:
    {{- . | trim | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "harbor-scanner-trivy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egressEnabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: api-server
          protocol: TCP
      {{- with .Values.networkPolicy.ingress }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.networkPolicy.egressEnabled }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- end }}
{{- end }}
