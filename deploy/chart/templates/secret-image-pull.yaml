{{/*
A dockerconfigjson pull Secret built from inline credentials, for installs that
have no pre-existing one to reference. Prefer image.pullSecrets and a Secret you
own: the password here is stored in the release, and therefore in whatever holds
your values file.
*/}}
{{- if .Values.imageCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-registry" (include "harbor-scanner-trivy.fullname" .) }}
  namespace: {{ include "harbor-scanner-trivy.namespace" . }}
  labels:
    {{- include "harbor-scanner-trivy.labels" . | nindent 4 }}
  {{- with (include "harbor-scanner-trivy.annotations" (dict "root" . "local" dict)) }}
  annotations:
    {{- . | trim | nindent 4 }}
  {{- end }}
type: kubernetes.io/dockerconfigjson
data:
  {{- $registry := .Values.imageCredentials.registry | default (.Values.global.imageRegistry | default .Values.image.registry) }}
  {{- $auth := printf "%s:%s" .Values.imageCredentials.username .Values.imageCredentials.password | b64enc }}
  {{- /* toJson, not %q: Go quoting emits escapes such as \x1b that are not valid JSON,
         so a credential holding a control character would produce an unparsable Secret. */}}
  .dockerconfigjson: {{ dict "auths" (dict $registry (dict "username" .Values.imageCredentials.username "password" .Values.imageCredentials.password "email" .Values.imageCredentials.email "auth" $auth)) | toJson | b64enc }}
{{- end }}
