{{/*
Only rendered for a chart-managed GitHub token. With trivy.existingSecret the
token stays in a Secret the chart never reads or owns.
*/}}
{{- if and .Values.trivy.gitHubToken (not .Values.trivy.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harbor-scanner-trivy.fullname" . }}
  namespace: {{ include "harbor-scanner-trivy.namespace" . }}
  labels:
    {{- include "harbor-scanner-trivy.labels" . | nindent 4 }}
  {{- with (include "harbor-scanner-trivy.annotations" (dict "root" . "local" dict)) }}
  annotations:
    {{- . | trim | nindent 4 }}
  {{- end }}
type: Opaque
data:
  gitHubToken: {{ .Values.trivy.gitHubToken | b64enc | quote }}
{{- end }}
