---
# PLACEHOLDERS. Replace with SealedSecrets, SOPS-encrypted Secrets, or
# ExternalSecrets producing the same names and keys - never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: harbor-scanner-trivy-redis
  namespace: harbor
type: Opaque
stringData:
  # Complete URL; the password lives here rather than in the pod spec.
  url: redis://:REPLACE_ME@harbor-redis:6379/5
---
apiVersion: v1
kind: Secret
metadata:
  name: harbor-scanner-trivy-github
  namespace: harbor
type: Opaque
stringData:
  # Raises the Trivy DB download rate limit from 60/h to 5000/h.
  token: REPLACE_ME
