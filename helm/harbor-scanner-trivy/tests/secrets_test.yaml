---
suite: secret handling
release:
  name: t
tests:
  - it: creates no Secret when no GitHub token is configured
    templates:
      - secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: stores an inlined GitHub token in a chart-managed Secret
    templates:
      - secret.yaml
    set:
      trivy.gitHubToken: ghp_example
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.gitHubToken
          value: Z2hwX2V4YW1wbGU=

  - it: creates no Secret when the token comes from an existing one
    templates:
      - secret.yaml
    set:
      trivy.gitHubToken: ghp_example
      trivy.existingSecret: my-token
    asserts:
      - hasDocuments:
          count: 0

  - it: injects no GitHub token env when there is no token
    templates:
      - statefulset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_TRIVY_GITHUB_TOKEN
          any: true

  - it: reads the GitHub token from the chart-managed Secret
    templates:
      - statefulset.yaml
    set:
      trivy.gitHubToken: ghp_example
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_TRIVY_GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: t-harbor-scanner-trivy
                key: gitHubToken

  - it: reads the GitHub token from an existing Secret and key
    templates:
      - statefulset.yaml
    set:
      trivy.existingSecret: my-token
      trivy.existingSecretKey: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_TRIVY_GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: my-token
                key: token

  - it: inlines the Redis URL by default
    templates:
      - statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_REDIS_URL
            value: "redis://harbor-harbor-redis:6379"

  - it: keeps a Redis URL holding a password out of the pod spec
    templates:
      - statefulset.yaml
    set:
      redis.existingSecret: redis-url
      redis.existingSecretKey: url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-url
                key: url
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCANNER_REDIS_URL
            value: "redis://harbor-harbor-redis:6379"
          any: true
